<!DOCTYPE html>
<html>

<head>

    <title>Garments ERP System</title>

    <link rel="stylesheet" href="style.css">

</head>

<body>

    <!-- Sidebar -->

    <aside class="sidebar">

        <h2>GARMENTS ERP</h2>

        <nav>

            <a href="#">Dashboard</a>
            <a href="#">Production</a>
            <a href="#">Planning</a>
            <a href="#">Machine Inventory</a>
            <a href="#">Efficiency</a>
            <a href="#">Reports</a>

        </nav>

    </aside>


    <!-- Main Content -->

    <main class="main-content">

        <!-- Header -->

        <header class="top-header">

            <h1>Production</h1>

            <span>Industrial Engineering</span>

        </header>


        <!-- Production Entry -->

        <section class="dashboard">

            <h2>Production Entry</h2>


            <div class="production-form">

                <label>
                    Date
                    <input type="date" id="date">
                </label>


                <label>
                    Unit
                    <select id="unit">

                        <option>PJL</option>
                        <option>PWL</option>
                        <option>PATL-A</option>
                        <option>PATL-B</option>

                    </select>
                </label>


                <label>
                    Line
                    <input type="text" id="line" placeholder="Line-01">
                </label>


                <label>
                    Style
                    <input type="text" id="style" placeholder="ST-1001">
                </label>


                <label>
                    Target
                    <input type="number" id="target" placeholder="1000">
                </label>


                <label>
                    Production
                    <input type="number" id="production" placeholder="950">
                </label>


                <button onclick="calculateEfficiency()">
                    Calculate Efficiency
                </button>

                <button onclick="saveProduction()">
                   Save Production
                </button>


                <div class="result">

                    <h3>Efficiency</h3>

                    <p id="efficiency">0%</p>

                </div>

                <h2>Production Records</h2>

                <table>

                <thead>

                 <tr>
                <th>Date</th>
                <th>Unit</th>
                <th>Line</th>
                <th>Style</th>
                <th>Target</th>
                <th>Production</th>
                <th>Efficiency</th>
                </tr>

                 </thead>

                <tbody id="productionTable">

                </tbody>

                </table>

            </div>


        </section>

    </main>


    <!-- JavaScript -->

    <script src="script.js"></script>

</body>

</html>
